name: candidate
run-name: "release-${{ inputs.requestId }}"

# On-demand production candidate build for the public release pipeline.
#
# Trigger: `workflow_dispatch` only, started from `main`, with the required
# `commit` input set to the full SHA of that exact `main` commit (`github.sha`)
# and a required unique `requestId` (32 lowercase hex). The run name is
# `release-<requestId>` (see run-name above), so scripts/publish-tag.ps1 can
# correlate this run even if the dispatch API answers HTTP 204 without a run id.
# This repository runs no automatic CI: there are no branch or pull-request
# triggers, and the release helper dispatches a candidate when a release is
# prepared.
#
# The run performs the source/license/static checks and then one deterministic
# production build (x64 PE with the static CRT, followed by
# `tauri bundle --bundles nsis`). It uploads the exact production setup
# executable plus `SHA256SUMS.txt` and `release-manifest.json` as the Actions
# artifact `windows-x64-<full commit SHA>`, with 30-day retention. The
# installer is never executed or installed here and no debug, Test-profile or
# fake-provider staging exists in this workflow.
#
# Permissions are read-only; no secrets are read and nothing is published. Only
# a successful dispatch run on `main` whose artifact belongs to exactly the
# commit named in the annotated tag can be the source of a public release (see
# .github/workflows/release.yml).
#
# The runner is Windows Server, which is never claimed to be a supported
# production platform: it only builds the artifact. The Windows 11 x64 gate
# lives in the installer itself and is not weakened by this workflow.

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "Full 40-hex SHA of the main commit to build (must equal the dispatched commit)"
        required: true
        type: string
      requestId:
        description: "Unique correlation token: 32 lowercase hex; the run is named release-<requestId>"
        required: true
        type: string

permissions:
  contents: read

env:
  BUN_VERSION: "1.4.2"
  RUST_VERSION: "1.97.1"
  TARGET_TRIPLE: "x86_64-pc-windows-msvc"

jobs:
  candidate:
    name: windows-x64 candidate
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      # The dispatch contract is checked before anything is built: the run must
      # come from `main`, the required `commit` input must be exactly the commit
      # this dispatch runs at (`github.sha`), and the required `requestId` input
      # must be 32 lowercase hex - it is already part of this run's name
      # (`release-<requestId>`), which is how scripts/publish-tag.ps1 correlates
      # a dispatch response that carries no run id. Any other value fails here.
      - name: Validate dispatch contract
        shell: pwsh
        env:
          REQUESTED_COMMIT: ${{ inputs.commit }}
          REQUESTED_REQUEST_ID: ${{ inputs.requestId }}
        run: |
          $ErrorActionPreference = 'Stop'
          $requested = [string]$env:REQUESTED_COMMIT
          if ($requested -notmatch '^[0-9a-f]{40}$') {
            throw "the 'commit' input '$requested' is not a full lowercase 40-hex commit SHA."
          }
          $requestId = [string]$env:REQUESTED_REQUEST_ID
          if ($requestId -notmatch '^[0-9a-f]{32}$') {
            throw "the 'requestId' input '$requestId' is not 32 lowercase hex characters."
          }
          if ($requested -ne [string]$env:GITHUB_SHA) {
            throw "the 'commit' input '$requested' does not equal the dispatched commit '$env:GITHUB_SHA'."
          }
          if ([string]$env:GITHUB_REF -ne 'refs/heads/main') {
            throw "the candidate workflow must be dispatched from 'main' (got '$env:GITHUB_REF')."
          }
          Write-Host "candidate accepted: $requested on $env:GITHUB_REF as release-$requestId"

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Confirm checked-out commit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $head = (& git rev-parse HEAD | Out-String).Trim()
          if ($head -ne [string]$env:GITHUB_SHA) {
            throw "checked out commit '$head' does not equal the dispatched commit '$env:GITHUB_SHA'."
          }

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Pin Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install "$env:RUST_VERSION" --profile minimal --target "$env:TARGET_TRIPLE" --no-self-update
          rustup default "$env:RUST_VERSION"
          rustc --version
          rustc -vV

      # Source, license and static gates: version mirrors, locked graph and
      # notices, public file manifest, no test-provider/custom-protocol, index
      # hygiene and a clean tracked tree.
      - name: Source and license checks
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/check-release.ps1

      # One deterministic production build: static-CRT x64 executable plus the
      # NSIS installer, its SHA256SUMS.txt and release-manifest.json. The
      # installer is only built, never run.
      - name: Build release executable and NSIS installer
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/build-release.ps1

      - name: Collect candidate assets
        id: assets
        shell: pwsh
        run: |
          $bundle = 'src-tauri/target/release/bundle/nsis'
          $manifestPath = Join-Path $bundle 'release-manifest.json'
          $sumsPath = Join-Path $bundle 'SHA256SUMS.txt'
          if (-not (Test-Path -LiteralPath $manifestPath -PathType Leaf)) {
            throw "release-manifest.json was not produced at $manifestPath."
          }
          if (-not (Test-Path -LiteralPath $sumsPath -PathType Leaf)) {
            throw "SHA256SUMS.txt was not produced at $sumsPath."
          }
          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          if ([string]$manifest.flavor -ne 'production') {
            throw "release manifest flavor '$($manifest.flavor)' is not 'production'."
          }
          if ([string]$manifest.commit -ne [string]$env:GITHUB_SHA) {
            throw "release manifest commit '$($manifest.commit)' does not equal the dispatched commit '$env:GITHUB_SHA'."
          }
          if ([string]$manifest.runId -ne [string]$env:GITHUB_RUN_ID) {
            throw "release manifest runId '$($manifest.runId)' does not equal this run '$env:GITHUB_RUN_ID'."
          }
          $installerName = [string]$manifest.installer.file
          $installerPath = Join-Path $bundle $installerName
          if (-not (Test-Path -LiteralPath $installerPath -PathType Leaf)) {
            throw "installer '$installerName' named by the manifest is missing."
          }
          "installer=$installerPath" >> $env:GITHUB_OUTPUT
          "sums=$sumsPath" >> $env:GITHUB_OUTPUT
          "manifest=$manifestPath" >> $env:GITHUB_OUTPUT

      - name: Upload candidate artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-x64-${{ github.sha }}
          path: |
            ${{ steps.assets.outputs.installer }}
            ${{ steps.assets.outputs.sums }}
            ${{ steps.assets.outputs.manifest }}
          retention-days: 30
          if-no-files-found: error
