name: Feature request
description: Suggest an idea or improvement for Speechek
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. You can write in English or Russian.

        **Do not attach or paste** Gemini API keys, `secrets.bin`, `settings.json`, audio recordings or other personal data.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like Speechek to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional. Other approaches or workarounds you have tried.
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Optional context for the request.
    validations:
      required: false
