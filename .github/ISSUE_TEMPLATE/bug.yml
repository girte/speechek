name: Bug report
description: Report a problem with Speechek
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. You can write in English or Russian.

        **Do not attach or paste** Gemini API keys, `secrets.bin`, `settings.json`, audio recordings or other personal data. This form does not require any of them.
  - type: input
    id: version
    attributes:
      label: Speechek version
      description: "Find it in Windows Settings → Apps → Installed apps → Speechek, or in the installer file name, for example `0.3.0`."
      placeholder: "0.3.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows build and architecture
      description: Run `winver` and include the build number and architecture.
      placeholder: "Windows 11 23H2 (build 22631.4317), x64"
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Recognition mode
      description: Optional. The mode selected in Settings → General settings when the problem happened.
      options:
        - Live Smart
        - Smart
        - Verbatim
        - Not related to recognition
        - Not sure
    validations:
      required: false
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What you did, in order.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What happened instead, including any message shown on screen.
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Optional. Screenshots without personal data are welcome.
    validations:
      required: false
